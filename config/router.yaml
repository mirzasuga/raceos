gateway:
  base_url: http://localhost:20128/v1
  api_key_env: NINE_ROUTER_API_KEY
  headers:
    X-Title: RaceOS Factory
  default_timeout_seconds: 60
  max_concurrent_requests: 5
catalog:
  gpt-5-sol:
    id: cx/gpt-5.6-sol
    provider: cx
    context_window: 256000
    cost_per_1k_input: 0.01
    cost_per_1k_output: 0.03
    latency_class: normal
    strengths:
    - architecture
    - planning
    - reasoning
  gpt-5-terra:
    id: cx/gpt-5.6-terra
    provider: cx
    context_window: 256000
    cost_per_1k_input: 0.01
    cost_per_1k_output: 0.03
    latency_class: normal
    strengths:
    - coding
    - refactoring
    - debugging
  gpt-5-mini:
    id: cx/gpt-5.4-mini
    provider: cx
    context_window: 128000
    cost_per_1k_input: 0.002
    cost_per_1k_output: 0.006
    latency_class: fast
    strengths:
    - classification
    - batch
    - simple_tasks
  gemini-pro:
    id: gemini/gemini-3.1-pro-preview
    provider: gemini
    context_window: 1048576
    cost_per_1k_input: 0.00125
    cost_per_1k_output: 0.01
    latency_class: normal
    strengths:
    - documentation
    - long_context
    - analysis
  gemini-flash:
    id: gemini/gemini-3.1-flash-lite-preview
    provider: gemini
    context_window: 128000
    cost_per_1k_input: 0.0002
    cost_per_1k_output: 0.0006
    latency_class: fast
    strengths:
    - classification
    - routing
    - batch
policy:
  rules:
  - match:
      task_type: classification
    model: gemini-flash
    max_tokens: 32
    temperature: 0.0
    reason: Cheapest for classification
  - match:
      task_type: architecture
    model: gpt-5-sol
    max_tokens: 8192
    temperature: 0.2
    reason: Best reasoning for design
  - match:
      task_type: planning
      complexity:
      - high
      - critical
    model: gpt-5-sol
    max_tokens: 8192
    temperature: 0.3
    reason: Deep planning
  - match:
      task_type: planning
    model: gpt-5-terra
    max_tokens: 4096
    temperature: 0.3
    reason: Medium planning
  - match:
      task_type: coding
    model: gpt-5-terra
    max_tokens: 8192
    temperature: 0.1
    reason: Best for code generation
  - match:
      task_type: debugging
    model: gpt-5-terra
    max_tokens: 4096
    temperature: 0.0
    reason: Deterministic debugging
  - match:
      task_type: review
    model: gpt-5-mini
    max_tokens: 4096
    temperature: 0.0
    reason: Cheap precise review
  - match:
      task_type: documentation
    model: gemini-pro
    max_tokens: 8192
    temperature: 0.3
    reason: Long context + good writing
  - match:
      task_type: spec_writing
    model: gpt-5-sol
    max_tokens: 4096
    temperature: 0.3
    reason: Structured reasoning
  - match:
      task_type: batch
    model: gemini-flash
    max_tokens: 2048
    temperature: 0.0
    reason: Cheapest capable
  default:
    model: gpt-5-terra
    max_tokens: 4096
    temperature: 0.1
fallback:
  chains:
    gpt-5-sol:
    - gpt-5-terra
    - gemini-pro
    - gpt-5-mini
    gpt-5-terra:
    - gpt-5-sol
    - gemini-pro
    - gpt-5-mini
    gpt-5-mini:
    - gemini-flash
    - gpt-5-terra
    gemini-pro:
    - gpt-5-terra
    - gpt-5-mini
    gemini-flash:
    - gpt-5-mini
    - gemini-pro
  max_fallback_attempts: 3
  retry_on_fallback: true
  preserve_temperature: true
retry:
  max_attempts: 3
  backoff:
    type: exponential
    base_delay_ms: 1000
    max_delay_ms: 30000
    multiplier: 2.0
    jitter: true
  retry_on_status:
  - 429
  - 500
  - 502
  - 503
  - 504
  no_retry_on_status:
  - 400
  - 401
  - 403
  - 404
  - 422
  escalation:
    enabled: true
    escalation_after_attempt: 2
    escalation_path:
    - gemini-flash
    - gpt-5-mini
    - gpt-5-terra
    - gpt-5-sol
timeout:
  per_model:
    gpt-5: 90
    claude-sonnet-latest: 60
    claude-sonnet: 60
    gemini-pro: 90
    deepseek-chat: 30
    deepseek-reasoner: 60
  per_task_type:
    classification: 15
    batch: 30
    coding: 120
    architecture: 120
    planning: 90
    documentation: 90
    review: 60
  connect_timeout_seconds: 10
  read_timeout_seconds: null
cost:
  budget:
    daily_limit_usd: 50.0
    per_task_limit_usd: 5.0
    per_session_limit_usd: 20.0
    alert_threshold_pct: 80
  degradation:
  - threshold_pct: 80
    action: alert
    description: Warn human, continue normally
  - threshold_pct: 90
    action: downgrade
    description: Route non-critical to cheaper models
    downgrade_map:
      gpt-5: claude-sonnet-latest
      claude-sonnet-latest: claude-sonnet
      claude-sonnet: deepseek-reasoner
      gemini-pro: deepseek-chat
  - threshold_pct: 95
    action: queue
    description: Queue non-urgent tasks for next budget cycle
  - threshold_pct: 100
    action: critical_only
    description: Only safety/critical tasks proceed
  track_per_call: true
  track_per_task: true
  track_per_model: true
  track_per_day: true
  ledger_path: ./data/cost_ledger.jsonl
  optimization:
    prefer_cached_prompts: true
    batch_low_priority: true
    skip_unnecessary_retries: true
