[project]
name = "raceos-factory"
version = "1.0.0"
description = "AI Software Factory for the RaceOS motorsport platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "RaceOS Team", email = "dev@raceos.dev" },
]
keywords = ["ai", "software-factory", "langgraph", "opencode", "motorsport", "embedded"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

dependencies = [
    "typer>=0.12,<1.0",
    "rich>=13.0,<16.0",
    "structlog>=24.0,<27.0",
    "pyyaml>=6.0,<7.0",
    "httpx>=0.27,<1.0",
    "tenacity>=9.0,<10.0",
    "tiktoken>=0.7,<1.0",
    "langgraph>=0.2,<2.0",
    "langchain-core>=0.3,<2.0",
    "pydantic>=2.0,<3.0",
    "jinja2>=3.1,<4.0",
    "filelock>=3.15,<4.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
    "pytest-asyncio>=0.23,<1.0",
    "ruff>=0.5.0",
    "respx>=0.21,<1.0",
    "mypy>=1.10",
]

[project.scripts]
raceos = "factory.cli.app:run"

[project.urls]
Homepage = "https://github.com/raceos/raceos-factory"
Documentation = "https://docs.raceos.dev"
Repository = "https://github.com/raceos/raceos-factory"
Issues = "https://github.com/raceos/raceos-factory/issues"
Changelog = "https://github.com/raceos/raceos-factory/blob/main/CHANGELOG.md"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests that require external services",
    "integration: marks integration tests",
]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/factory"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
fail_under = 60
show_missing = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/factory/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/factory"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "config/",
    "specs/",
    "langgraph/",
    "tests/",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]
